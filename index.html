<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jungle Jam &amp; Friends</title>
  <meta name="theme-color" content="#123524">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jungle Jam">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <meta name="app-version" content="20261028163128">
  <script>
    // Load the app's files with a version tag so home-screen copies never get stuck on an old version.
    (function () {
      var v = new URLSearchParams(location.search).get("v") || document.querySelector('meta[name="app-version"]').content;
      window.JJ_LOADED_VERSION = v;
      var css = document.createElement("link");
      css.rel = "stylesheet"; css.href = "style.css?v=" + encodeURIComponent(v);
      document.head.appendChild(css);
      window.JJ_SCRIPTS = ["config.js", "art.js", "episode-info.js", "app.js"].map(function (f) {
        return f + "?v=" + encodeURIComponent(v);
      });
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="canopy" aria-hidden="true">
      <svg viewBox="0 0 400 70" preserveAspectRatio="none">
        <path d="M0 0H400V18C380 30 360 14 340 26C318 38 300 16 278 28C256 40 240 18 218 30C196 42 178 20 156 30C132 42 116 18 94 28C72 38 56 16 34 26C18 33 8 26 0 30Z" fill="#1d5a36"/>
        <path d="M0 0H400V10C384 20 366 6 346 16C326 26 308 8 288 18C266 28 248 8 226 18C206 28 186 10 166 18C144 28 126 8 104 18C84 28 64 8 44 18C26 26 12 14 0 18Z" fill="#2c7a46"/>
        <g fill="#3fa45f">
          <path d="M60 14C64 30 58 44 48 52C50 38 52 26 60 14Z"/>
          <path d="M150 16C158 30 156 46 146 56C146 42 146 28 150 16Z"/>
          <path d="M250 14C258 26 260 40 252 50C250 38 248 26 250 14Z"/>
          <path d="M344 18C352 32 348 46 338 54C340 40 340 30 344 18Z"/>
        </g>
        <g fill="none" stroke="#2c7a46" stroke-width="2.5" stroke-linecap="round">
          <path d="M110 20C112 40 104 54 108 68"/>
          <path d="M300 20C298 34 306 46 302 60"/>
        </g>
        <g fill="#3fa45f">
          <ellipse cx="108" cy="44" rx="5" ry="3" transform="rotate(-30 108 44)"/>
          <ellipse cx="106" cy="58" rx="5" ry="3" transform="rotate(30 106 58)"/>
          <ellipse cx="301" cy="38" rx="5" ry="3" transform="rotate(30 301 38)"/>
          <ellipse cx="304" cy="52" rx="5" ry="3" transform="rotate(-30 304 52)"/>
        </g>
      </svg>
    </div>
    <button class="back" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Jungle Jam &amp; Friends</h1>
    <button class="icon-btn" id="refresh" aria-label="Refresh episode list" title="Refresh episode list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
  </header>

  <div class="stage" id="stage" hidden>
    <video id="video" playsinline controls preload="metadata"></video>
  </div>

  <main id="view" aria-live="polite"></main>

  <audio id="audio" preload="metadata"></audio>

  <footer class="player" id="player" hidden>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
    <div class="player-row">
      <button class="now" id="now" aria-label="Open current episode">
        <span class="now-title" id="nowTitle"></span>
        <span class="now-sub" id="nowSub"></span>
      </button>
      <div class="controls">
        <button class="icon-btn" id="back15" aria-label="Back 15 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/><text x="12" y="15.5" text-anchor="middle">15</text></svg>
        </button>
        <button class="play-btn" id="playPause" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button class="icon-btn" id="next" aria-label="Next part">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM17 5h2v14h-2z"/></svg>
        </button>
        <button class="icon-btn sleep" id="sleep" aria-label="Sleep timer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <span id="sleepLabel"></span>
        </button>
      </div>
    </div>
  </footer>

  <dialog id="sleepDialog">
    <form method="dialog">
      <h2>Sleep timer</h2>
      <p>Stop playing after…</p>
      <div class="sleep-options">
        <button value="15">15 min</button>
        <button value="30">30 min</button>
        <button value="45">45 min</button>
        <button value="episode">End of episode</button>
        <button value="off" class="ghost">Off</button>
      </div>
    </form>
  </dialog>

  <script>
    (function next(list) {
      if (!list.length) return;
      var s = document.createElement("script");
      s.src = list[0];
      s.onload = function () { next(list.slice(1)); };
      document.body.appendChild(s);
    })(window.JJ_SCRIPTS);
  </script>
</body>
</html>
